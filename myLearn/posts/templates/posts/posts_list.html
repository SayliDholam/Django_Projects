<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts List</title>
</head>
<body>
    <section>
        <h1>Posts</h1>

        {% for post in posts %}
            <article>
                <h2>{{ post.title }}</h2>
                <p>{{ post.body }}</p>
                <small>Posted on: {{ post.date }}</small>       
            </article>
        {% endfor %}
    </section>
    
</body>
</html>
